#:schema https://mise.jdx.dev/schema/mise.json

[tasks.typecheck]
run = "tsc --noEmit -p tsconfig.json"

[tasks.test]
description = "Score AI role adapters on the synthetic corpus with fake providers."
run = "node ../../node_modules/vitest/vitest.mjs run"

[tasks.bench]
description = "Run the paid Claude generation benchmark on the synthetic corpus (owner approval per run)."
usage = '''
flag "--paid" help="Confirm the owner approved this paid run."
flag "--max-cost-usd <usd>" default="2" help="Stop before a call that could exceed this estimated spend."
'''
run = "bun ../../scripts/inference-benchmark.ts {% if usage.paid %}--paid{% endif %} --max-cost-usd {{ usage.max_cost_usd }}"
