#:schema https://mise.jdx.dev/schema/mise.json

[tasks.typecheck]
run = "tsc --noEmit -p tsconfig.json"

[tasks.test]
description = "Score AI role adapters on the synthetic corpus with fake providers; check the real-page corpus."
run = "node ../../node_modules/vitest/vitest.mjs run"

[tasks.bench]
description = "Benchmark generation or the sign-in judge on a corpus: Claude (paid, owner approval per run) or the free heuristic."
usage = '''
flag "--paid" help="Confirm the owner approved this paid Claude run."
flag "--max-cost-usd <usd>" default="2" help="Stop before a call that could exceed this estimated spend."
flag "--corpus <name>" default="synthetic" help="The synthetic corpus, the Formasaurus real-page corpus, the Japanese pages, the English pages, the request-log pages, or the sign-in judge's pages." {
  choices "synthetic" "real" "japanese" "web" "log" "judge"
}
flag "--corpus-file <path>" help="With --corpus log: an absolute path to request-log pages kept outside the repository, scored after the repository's."
flag "--provider <name>" default="claude" help="Claude, or the model-free heuristic comparator." {
  choices "claude" "heuristic"
}
flag "--from <index>" default="0" help="Index of the first case, to run the corpus in batches."
flag "--count <n>" help="Number of cases in this batch; all remaining when omitted."
flag "--model <id>" default="claude-opus-5-5" help="The Claude model to compare, one priced in src/providers/claude-pricing.json; the service runs claude-opus-5-5."
flag "--effort <level>" default="low" help="The effort to run the model at." {
  choices "low" "medium" "high" "xhigh" "max"
}
flag "--speed <speed>" default="standard" help="Fast mode, on the models priced for it." {
  choices "standard" "fast"
}
'''
run = "bun ../../scripts/inference-benchmark.ts {% if usage.paid %}--paid{% endif %} --max-cost-usd {{ usage.max_cost_usd }} --corpus {{ usage.corpus }} {% if usage.corpus_file %}--corpus-file {{ usage.corpus_file | quote }}{% endif %} --provider {{ usage.provider }} --from {{ usage.from }} {% if usage.count %}--count {{ usage.count }}{% endif %} --model {{ usage.model }} --effort {{ usage.effort }} --speed {{ usage.speed }}"

[tasks.pricing]
description = "Refresh the committed Claude rates from the public pricing page (ADR 0014)."
run = ["bun ../../scripts/claude-pricing.ts", "oxfmt src/providers/claude-pricing.json"]

[tasks."corpus:formasaurus"]
description = "Regenerate the real-page corpus from a local Formasaurus checkout (ADR 0012)."
usage = '''
arg "<source>" help="Absolute path to a Formasaurus checkout; its commit is recorded in the corpus."
flag "--chromium <path>" help="Chromium executable, when Playwright's own is not installed."
'''
run = [
  "bun ../../scripts/formasaurus/import.ts --source {{ usage.source }} {% if usage.chromium %}--chromium {{ usage.chromium }}{% endif %}",
  "oxfmt src/corpus/formasaurus.json",
]

[tasks."corpus:log"]
description = "Turn request-log rows into unlabelled cases, or labelled cases into the corpus files (ADR 0012)."
usage = '''
arg "<command>" help="draft: rows to unlabelled cases; assemble: unlabelled cases and labels to the corpus files." {
  choices "draft" "assemble"
}
flag "--rows <file>" help="draft: an absolute path to the inference_log rows, as JSON."
flag "--outcomes <file>" help="draft: an absolute path to the login_outcomes rows, as JSON."
flag "--replacements <file>" help="draft: an absolute path to the synthetic field names and text replacements."
flag "--drafts <file>" help="An absolute path outside the repository for the unlabelled cases: written by draft, read by assemble."
flag "--labels <file>" help="assemble: an absolute path to the labels by case ID."
flag "--private <file>" help="assemble: an absolute path for the pages kept outside the repository."
'''
run = [
  "bun ../../scripts/log-corpus.ts {{ usage.command }} {% if usage.rows %}--rows {{ usage.rows | quote }}{% endif %} {% if usage.outcomes %}--outcomes {{ usage.outcomes | quote }}{% endif %} {% if usage.replacements %}--replacements {{ usage.replacements | quote }}{% endif %} {% if usage.drafts %}--drafts {{ usage.drafts | quote }}{% endif %} {% if usage.labels %}--labels {{ usage.labels | quote }}{% endif %} {% if usage.private %}--private {{ usage.private | quote }}{% endif %}",
  "oxfmt src/corpus/log.json",
]

[tasks."corpus:japanese"]
description = "Observe public login pages live: refresh the Japanese or English corpus, or report listed pages to label."
usage = '''
flag "--refresh" help="Observe every corpus page again and move each label to the new observation."
flag "--web" help="Refresh the English pages (src/corpus/web.json) instead of the Japanese ones."
flag "--report <file>" help="Write the observations of the listed pages to this local file (an absolute path)."
flag "--chromium <path>" help="Chromium or Chrome executable, when Playwright's own is not installed."
flag "--headed" help="Show the browser window."
arg "[url]..." var=#true help="Public login pages to observe for labelling."
'''
run = [
  "bun ../../scripts/japanese/observe.ts {% if usage.refresh %}--refresh{% endif %} {% if usage.web %}--corpus src/corpus/web.json{% endif %} {% if usage.report %}--report {{ usage.report | quote }}{% endif %} {% if usage.chromium %}--chromium {{ usage.chromium | quote }}{% endif %} {% if usage.headed %}--headed{% endif %} {% for url in usage.url %}{{ url | quote }} {% endfor %}",
  "oxfmt src/corpus/japanese.json src/corpus/web.json",
]
