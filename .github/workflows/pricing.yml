name: Pricing
# Reads Claude's public pricing page daily into the committed rates (ADR 0014) and
# proposes any change as a pull request, merged like any other once CI passes.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
concurrency:
  group: pricing
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  refresh:
    name: Refresh Claude rates
    # The proposal targets main, so it starts only from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # Find an open proposal.
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      open-pr: ${{ steps.diff.outputs.open-pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Read the pricing page
        run: mise run //packages/inference:pricing
      - name: Compare with main
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: pricing/claude-rates
          FILE: packages/inference/src/providers/claude-pricing.json
        run: |
          set -euo pipefail
          open_pr=$(gh pr list -R "${REPO}" --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          echo "open-pr=${open_pr}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet -- "${FILE}"; then
            echo "The rates are unchanged."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            git diff -- "${FILE}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-pricing-${{ github.run_id }}
          path: packages/inference/src/providers/claude-pricing.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  propose:
    name: Propose the change
    needs: [refresh]
    # Runs only when there is something to open, update or close.
    if: ${{ vars.BOT_APP_CLIENT_ID != '' && (needs.refresh.outputs.changed == 'true' || needs.refresh.outputs.open-pr != '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    # The bot App's private key is the release environment's secret, which only main can use.
    environment: release
    steps:
      # A push or PR made with GITHUB_TOKEN starts no workflow, and the repository does not
      # let GitHub Actions create pull requests; the bot App's token does both.
      - name: Create the bot GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write # for the pricing branch and its commit
          permission-pull-requests: write # to open or close the pull request
      # No checkout: this job runs no repository code while it holds the App's token.
      - if: ${{ needs.refresh.outputs.changed == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-pricing-${{ github.run_id }}
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ steps.github-app.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          BRANCH: pricing/claude-rates
          CHANGED: ${{ needs.refresh.outputs.changed }}
          OPEN_PR: ${{ needs.refresh.outputs.open-pr }}
          FILE: packages/inference/src/providers/claude-pricing.json
          LOCAL: claude-pricing.json
        run: |
          set -euo pipefail
          open_pr="${OPEN_PR}"
          if [[ "${CHANGED}" != "true" ]]; then
            # The page went back to main's rates: the open proposal is stale.
            if [[ -n "${open_pr}" ]]; then
              gh pr close -R "${REPO}" "${open_pr}" --delete-branch \
                --comment "The pricing page lists main's rates again."
            fi
            exit 0
          fi
          if [[ -n "${open_pr}" ]]; then
            current=$(gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" --jq .content)
            if base64 -d <<<"${current}" | cmp -s - "${LOCAL}"; then
              echo "Pull request #${open_pr} already carries these rates."
              exit 0
            fi
          elif gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            # No open proposal uses the branch: restart it from this main commit.
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="${BASE_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${BASE_SHA}" >/dev/null
          fi
          # The contents API commits as the bot App, and GitHub signs that commit. An open
          # proposal gets a new commit on top, so it is never left without changes. Both the
          # push and the new pull request start CI, since the App's token made them.
          blob=$(gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" --jq .sha)
          gh api -X PUT "repos/${REPO}/contents/${FILE}" \
            -f message="chore(inference): refresh Claude rates from the pricing page" \
            -f content="$(base64 -w0 "${LOCAL}")" -f sha="${blob}" -f branch="${BRANCH}" >/dev/null
          if [[ -z "${open_pr}" ]]; then
            gh pr create -R "${REPO}" --head "${BRANCH}" --base main \
              --title "chore(inference): refresh Claude rates from the pricing page" \
              --body "The scheduled pricing workflow read new rates from https://platform.claude.com/docs/en/about-claude/pricing.md (ADR 0014). Check the diff against the page, then merge once CI passes."
          fi
