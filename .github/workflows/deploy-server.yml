name: Deploy server
on:
  # zizmor: ignore[dangerous-triggers]
  # Privileged by design: the release needs the production environment. The job runs
  # only for a successful CI run that a push to main in this repository started, and
  # it re-reads that run through the API before checking out its exact revision. The
  # workflow definition comes from the default branch, so no branch can change it.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  # Retries and releases of an earlier CI run.
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run for the current main revision
        type: string
        required: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: Deploy tested server
    # Every successful main push releases; there is no enable switch. Until the owner
    # has set the production credentials, the first step fails before any change.
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    # Keep this lock through migration, activation and smoke. It sits on the job so a
    # skipped run (failed CI, another event) never displaces a pending release.
    concurrency:
      group: server-production
      cancel-in-progress: false
    permissions:
      actions: read # Verify the CI run and download its immutable artifact.
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_WORKER: ${{ vars.SERVER_WORKER }}
      SERVER_HEALTH_URL: ${{ vars.SERVER_HEALTH_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Require the production credentials before anything else
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${API_TOKEN}" || ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Set the production environment secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Require successful CI for this exact main revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.ci_run_id }}
          # A dispatch releases the main revision it was started on.
          DISPATCH_REVISION: ${{ github.sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_REVISION: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${EVENT_NAME}" = workflow_dispatch ]]; then
            expected="${DISPATCH_REVISION}"
            ci_run_id="${DISPATCH_RUN_ID}"
          else
            # Main CI runs can finish out of order, and the release lock keeps only the
            # newest pending run, so every automatic run releases the current main
            # rather than the revision that triggered it.
            expected="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            [[ "${expected}" =~ ^[0-9a-f]{40}$ ]]
            live="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "${SERVER_HEALTH_URL}" | jq -r '.revision // empty' || true)"
            if [[ "${live}" = "${expected}" ]]; then
              echo "release=false" >> "${GITHUB_OUTPUT}"
              echo "Main revision ${expected} is already live." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            if [[ "${expected}" = "${TRIGGER_REVISION}" ]]; then
              # Main's own CI run is the last automatic chance; don't depend on a list query.
              ci_run_id="${TRIGGER_RUN_ID}"
            else
              ci_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${expected}&per_page=1" --jq '.workflow_runs[0].id // empty')"
            fi
            if [[ -z "${ci_run_id}" ]]; then
              echo "release=false" >> "${GITHUB_OUTPUT}"
              echo "Main revision ${expected} has no successful CI run yet; its own CI run releases it." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          [[ "${ci_run_id}" =~ ^[0-9]+$ ]]
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}")"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          jq -e --arg repository "${GITHUB_REPOSITORY}" --arg revision "${expected}" \
            --argjson workflow "${workflow_id}" '
            .event == "push" and .head_branch == "main" and
            .head_repository.full_name == $repository and .head_sha == $revision and
            .workflow_id == $workflow and .status == "completed" and .conclusion == "success"
          ' <<< "${run}"
          revision="$(jq -r .head_sha <<< "${run}")"
          attempt="$(jq -r .run_attempt <<< "${run}")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ && "${attempt}" =~ ^[0-9]+$ ]]
          {
            echo "release=true"
            echo "revision=${revision}"
            echo "run-id=${ci_run_id}"
            echo "attempt=${attempt}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.source.outputs.release == 'true' }}
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: ${{ steps.source.outputs.release == 'true' }}
        with:
          version: 2026.10.7
          install_args: --locked
      - name: Install deployment tools from the tested lockfile
        if: ${{ steps.source.outputs.release == 'true' }}
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.source.outputs.release == 'true' }}
        with:
          name: server-${{ steps.source.outputs.revision }}-${{ steps.source.outputs.run-id }}-${{ steps.source.outputs.attempt }}
          path: work/server-release/
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run-id }}
      - name: Verify artifact provenance, digests and deployment configuration
        if: ${{ steps.source.outputs.release == 'true' }}
        id: restore
        env:
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          RELEASE_RUN_ID: ${{ steps.source.outputs.run-id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: mise exec -- node .github/scripts/server-artifact.mjs restore
      - name: Skip superseded revisions before the first mutation
        if: ${{ steps.source.outputs.release == 'true' }}
        id: current
        env:
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${current}" = "${RELEASE_REVISION}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Superseded by main revision ${current} during the release; the next automatic run releases it." >> "${GITHUB_STEP_SUMMARY}"
          fi
      # Migrations must be additive so the serving Worker keeps working on the new
      # schema. A failed migration stops the release before activation.
      - name: Apply the released migrations to the recorded database
        if: ${{ steps.current.outputs.deploy == 'true' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE: ${{ steps.restore.outputs.database }}
          CF_QUIET: "1"
        run: |
          cf=(mise exec -- node node_modules/cf/bin/cf)
          migrations="${GITHUB_WORKSPACE}/work/server-release/migrations"
          # Verify the target before changing it: the exact ID and its expected name.
          "${cf[@]}" d1 get "${DATABASE}" |
            jq -e --arg id "${DATABASE}" '(.result // .) | .uuid == $id and .name == "pateat"' > /dev/null
          {
            echo '```json'
            "${cf[@]}" d1 migrations list "${DATABASE}" --dir "${migrations}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          "${cf[@]}" d1 migrations apply "${DATABASE}" --dir "${migrations}"
          "${cf[@]}" d1 migrations list "${DATABASE}" --dir "${migrations}" |
            jq -e 'length == 0' > /dev/null
      - name: Activate the exact prebuilt server
        if: ${{ steps.current.outputs.deploy == 'true' }}
        id: deploy
        uses: risu729/wrangler-deploy-action@a9db854f3a31cdf3cdf28977e66f52f32fc9e8a0 # v2.2.2
        with:
          mode: production
          working-directory: services/api
          worker: ${{ vars.SERVER_WORKER }}
          build-mode: production
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          production-strategy: versions
          deploy-triggers: "false"
      - name: Verify deployment readback and hosted revision
        if: ${{ steps.current.outputs.deploy == 'true' }}
        env:
          RELEASE_REVISION: ${{ steps.source.outputs.revision }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment-id }}
          VERSION_ID: ${{ steps.deploy.outputs.version-id }}
        run: mise exec -- node .github/scripts/server-health.mjs
