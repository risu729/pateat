name: Extension release
# Builds the production extension ZIP and its Corresponding Source and opens a draft GitHub
# Release. The owner reviews and publishes the draft by hand; nothing here publishes it,
# uploads to the Chrome Web Store or uses a signing key (docs/delivery.md#extension-releases).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack only, without a draft release (any branch).
        type: boolean
        default: false
# One run per branch and mode at a time, so that two drafts never race for the same tag;
# a dry run never waits for a release.
concurrency:
  group: extension-release-${{ github.ref }}-${{ inputs.dry-run }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  PATEAT_REVISION: ${{ github.sha }}
jobs:
  pack:
    name: Pack
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pack.outputs.tag }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Release only from main
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::A draft release is made from main only, not ${REF}; use dry-run elsewhere."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          # Release tools come from the lockfile's downloads, not a cache another run wrote.
          cache: false
      - name: Install frozen dependencies
        run: aube ci
      - name: Check the pinned SDK source metadata
        run: mise run check:sdk-source
      - name: Build and zip the production extension
        run: mise run //apps/extension:zip
      - name: Pack the extension with its Corresponding Source
        id: pack
        run: mise exec -- node .github/scripts/extension-release.mjs pack
      - name: Summarize the packed release
        working-directory: work/extension-release
        run: |
          {
            echo "### Pateat $(jq -r .version release.json) from ${GITHUB_SHA}"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
            echo
            echo "SDK $(jq -r '.sdk.package + "@" + .sdk.version + " at " + .sdk.revision' release.json)," \
              "$(jq '.packages | length' release.json) bundled packages."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-release-${{ github.sha }}
          path: work/extension-release/
          if-no-files-found: error
          # "Re-run all jobs" packs the revision again under the same name.
          overwrite: true
          retention-days: 14
  draft:
    name: Draft release
    needs: [pack]
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read # Require a passing CI Check on the released revision.
      contents: write # Create the draft release and upload its files.
    env:
      TAG: ${{ needs.pack.outputs.tag }}
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      # No checkout: this job runs no repository code while it holds a write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release-${{ github.sha }}
          path: work/extension-release/
      - name: Verify the packed files
        working-directory: work/extension-release
        run: |
          sha256sum --check --strict SHA256SUMS
          jq -e --arg revision "${GITHUB_SHA}" --arg tag "${TAG}" \
            '.revision == $revision and .tag == $tag and .repository == env.GITHUB_REPOSITORY' \
            release.json > /dev/null
      - name: Require a passing CI Check on this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20Check&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at) | .conclusion // empty')"
          if [[ "${conclusion}" != success ]]; then
            echo "::error::CI Check on ${GITHUB_SHA} is '${conclusion:-missing}'; release a revision whose CI passed."
            exit 1
          fi
      - name: Refuse a version that already has a release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a definite "not found" lets the release go ahead; any other error (rate
          # limit, outage) stops it, since gh would attach the draft to an existing tag.
          # Drafts have no tag yet, so list them by tag name.
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .html_url')"
          if [[ -n "${releases}" ]]; then
            echo "::error::A release for ${TAG} exists (${releases}); raise the version in apps/extension/package.json."
            exit 1
          fi
          if output="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"; then
            echo "::error::Tag ${TAG} exists; raise the version in apps/extension/package.json."
            exit 1
          elif [[ "${output}" != *"HTTP 404"* ]]; then
            echo "::error::Could not check for tag ${TAG}: ${output}"
            exit 1
          fi
      - name: Create the draft release
        working-directory: work/extension-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft creates no tag; publishing it creates the tag at this revision.
          url="$(gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft \
            --target "${GITHUB_SHA}" --title "Pateat ${VERSION}" --notes-file notes.md \
            "pateat-${VERSION}-chrome.zip" "pateat-${VERSION}-source.tar.gz" release.json SHA256SUMS)"
          {
            echo "Draft release: ${url}"
            echo
            echo "Before publishing it, check the steps in docs/delivery.md#extension-releases."
          } >> "${GITHUB_STEP_SUMMARY}"
