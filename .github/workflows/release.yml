name: Extension release
# Like biwa's release-plz: every push to main updates one release PR (the version in
# apps/extension/package.json and CHANGELOG.md, from Conventional Commits). Merging that PR
# tags v<version>, builds the release extension (PATEAT_RELEASE=true) and publishes the
# GitHub Release; its source is the tag's own archive (docs/delivery.md#extension-releases).
# Nothing here uploads to the Chrome Web Store or uses a signing key.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack only, without a release PR or a release (any branch).
        type: boolean
        default: false
# Runs on main never overlap. GitHub keeps one pending run per group, so a merge's run can be
# cancelled by a later push; that later run still finds the merged release PR and releases it.
concurrency:
  group: extension-release-${{ github.ref }}-${{ inputs.dry-run || false }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
jobs:
  release-please:
    name: Release PR
    # Skipped until the release environment's bot App is set up (docs/delivery.md).
    if: ${{ github.repository_owner == 'risu729' && github.ref == 'refs/heads/main' && !inputs.dry-run && vars.BOT_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    environment: release
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A PR or tag made with GITHUB_TOKEN starts no workflow, so the release PR would get no
      # CI Check; the bot App's token does.
      - name: Create the bot GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write # for the release PR branch, the tag and the draft release
          permission-pull-requests: write # for the release PR
      - name: Update the release PR, or tag and draft a merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.github-app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  pack:
    name: Pack
    needs: [release-please]
    # A dry run packs whatever branch it was started on; otherwise only a merged release PR.
    if: ${{ !cancelled() && (inputs.dry-run || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The release build leaves debug logging off (ADR 0019).
      PATEAT_RELEASE: "true"
      PATEAT_REVISION: ${{ needs.release-please.outputs.sha || github.sha }}
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATEAT_REVISION }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          # Release tools come from the lockfile's downloads, not a cache another run wrote.
          cache: "false"
      - name: Check the pinned SDK source metadata
        run: mise run check:sdk-source
      - name: Build and zip the release extension
        run: mise run //apps/extension:zip
      - name: Pack the extension with its source
        id: pack
        run: mise exec -- node .github/scripts/extension-release.mjs pack
      - name: Require the tag release-please made
        if: ${{ !inputs.dry-run }}
        env:
          EXPECTED: ${{ needs.release-please.outputs.tag }}
          PACKED: ${{ steps.pack.outputs.tag }}
        run: |
          if [[ "${PACKED}" != "${EXPECTED}" ]]; then
            echo "::error::Packed ${PACKED}, but release-please tagged ${EXPECTED}."
            exit 1
          fi
      - name: Summarize the packed release
        working-directory: work/extension-release
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          {
            echo "### Pateat ${VERSION} from ${PATEAT_REVISION}"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-release-${{ env.PATEAT_REVISION }}
          path: work/extension-release/
          if-no-files-found: error
          # "Re-run all jobs" packs the revision again under the same name.
          overwrite: true
          retention-days: 14
  publish:
    name: Publish release
    needs: [release-please, pack]
    if: ${{ !cancelled() && needs.pack.result == 'success' && needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # Upload the files to the draft release and publish it.
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      REVISION: ${{ needs.release-please.outputs.sha }}
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      # No checkout: this job runs no repository code while it holds a write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-release-${{ needs.release-please.outputs.sha }}
          path: work/extension-release/
      - name: Verify the packed files
        working-directory: work/extension-release
        run: |
          sha256sum --check --strict SHA256SUMS
          # The release text names the commit and tag it was packed for.
          grep -qF "/commit/${REVISION})" notes.md
          grep -qF "repository at \`${TAG}\`" notes.md
      - name: Attach the files and publish the release
        working-directory: work/extension-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-please wrote the changelog as the draft's text; the file list follows it.
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > body.md
          { cat body.md; echo; echo '---'; echo; cat notes.md; } > release.md
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "pateat-${VERSION}-chrome.zip" SHA256SUMS
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release.md \
            --title "Pateat ${VERSION}" --draft=false --latest
          echo "Released: $(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)" \
            >> "${GITHUB_STEP_SUMMARY}"
