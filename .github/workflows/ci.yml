name: CI
# No path filters: every PR must receive the required aggregate result.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A newer PR push cancels the older run. Every main push finishes its own run, because a
# cancelled main run produces no release artifact and never starts the server deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  PATEAT_REVISION: ${{ github.sha }}
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.8
          install_args: --locked
      - &install
        name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated browser runtime
        run: mise run browser:install --with-deps
      - name: Run the complete local verification graph
        env:
          # Use the read-only job token for upstream action-pin verification.
          GITHUB_TOKEN: ${{ github.token }}
          # The Linux browser shards below run the packaged-extension browser tests.
          PATEAT_SKIP_E2E: "1"
        run: mise run check
      - name: Prepare tested server artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: mise exec -- node .github/scripts/server-artifact.mjs pack
      - name: Archive tested server artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/server-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  linux-browser:
    name: Linux browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Let every shard report its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - *checkout
      - *mise
      - *install
      - name: Install isolated browser runtime
        run: mise run browser:install --with-deps
      - name: Run the packaged-extension browser tests
        env:
          PATEAT_E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: mise run //tests/extension:test
      - name: Archive browser test failure context
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/extension/
          if-no-files-found: ignore
          retention-days: 7
  windows-browser:
    name: Windows browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - *checkout
      - *mise
      - *install
      - name: Install isolated browser runtime
        run: mise run browser:install
      - name: Run the packaged-extension browser tests
        # Keep browser profiles on the runner's work drive. Profiles in the default temp
        # directory on the system drive hit 5-25 s I/O stalls that timed out random tests.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PATEAT_E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: mise run //tests/extension:test
      - name: Archive browser test failure context
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-browser-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/extension/
          if-no-files-found: ignore
          retention-days: 7
  ci-check:
    name: CI Check
    needs: [verify, linux-browser, windows-browser]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all verification to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          LINUX_BROWSER_RESULT: ${{ needs.linux-browser.result }}
          WINDOWS_BROWSER_RESULT: ${{ needs.windows-browser.result }}
        run: |
          test "${VERIFY_RESULT}" = success
          test "${LINUX_BROWSER_RESULT}" = success
          test "${WINDOWS_BROWSER_RESULT}" = success
