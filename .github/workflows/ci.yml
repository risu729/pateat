name: CI
# No path filters: every PR must receive the required aggregate result.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  PATEAT_REVISION: ${{ github.sha }}
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.6
          install_args: --locked
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated browser runtime
        run: mise run browser:install --with-deps
      - name: Run the complete local verification graph
        env:
          # Use the read-only job token for upstream action-pin verification.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run check
      - name: Prepare tested server artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mise exec -- node .github/scripts/server-artifact.mjs pack
      - name: Archive tested server artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/server-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ci-check:
    name: CI Check
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all verification to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "${VERIFY_RESULT}" = success
