name: CI
# No workflow-level path filters: every PR must receive the required aggregate result. The
# `changes` job decides instead which jobs a PR needs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A newer PR push cancels the older run. Every main push finishes its own run, because a
# cancelled main run produces no release artifact and never deploys the server.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  PATEAT_REVISION: ${{ github.sha }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read # List the changed files of the pull request.
    outputs:
      # Only a pull request that changes nothing but documentation or the docs website skips
      # the browser tests; main pushes and manual runs always run them.
      browser: ${{ github.event_name != 'pull_request' || steps.filter.outputs.browser == 'true' }}
    steps:
      # No checkout: on a pull_request event the action lists the changed files through the API.
      - name: Find what the pull request changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            browser:
              - '**'
              - '!docs/**'
              - '!apps/docs/**'
              - '!AGENTS.md'
              - '!README.md'
              - '!README.ja.md'
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
          install_args: --locked
      - &install
        name: Install frozen dependencies
        run: mise deps --force aube_workspace
      - &browser
        name: Install isolated browser runtime
        # No --with-deps: the runner image already has every library Chromium links (a missing
        # one stops the launch with the file named). apt only added fonts, xvfb and updates, all
        # unused by headless tests: 25 MB a slow Azure mirror took 8-9.5 minutes for (2026-10-22).
        run: mise run browser:install
      - name: Run the complete local verification graph
        env:
          # Use the read-only job token for upstream action-pin verification.
          GITHUB_TOKEN: ${{ github.token }}
          # The browser shards below run the packaged-extension browser tests.
          PATEAT_SKIP_E2E: "1"
          # The `Event orders` job below walks every order of events of a small login.
          PATEAT_SKIP_ORDERS: "1"
          # Each Vitest run writes coverage/<run>/coverage-final.json.
          PATEAT_COVERAGE: "1"
        run: mise run check
      - name: Summarize test coverage
        # Report only: a failed test run still gets the table of what it measured, and the
        # summary never fails the job.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: mise run coverage:summary
      - name: Prepare tested server artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: mise exec -- node .github/scripts/server-artifact.mjs pack
      - name: Archive tested server artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ github.sha }}
          path: work/server-release/
          include-hidden-files: true
          if-no-files-found: error
          # "Re-run all jobs" packs the revision again under the same name.
          overwrite: true
          retention-days: 14
  orders:
    name: Event orders
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *checkout
      - *mise
      - *install
      # Each walk takes seconds of CPU: beside the rest of the graph in Verify they took about
      # 50 s each (run 40034957203), here they add nothing to the run's time.
      - name: Walk every order of events of a small login
        run: mise run //packages/contracts:test:orders
  browser:
    name: Browser (${{ matrix.shard }}/${{ matrix.total }})
    needs: [changes]
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Let every shard report its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        # The number of shards above.
        total: [6]
    steps:
      - *checkout
      - *mise
      - *install
      - *browser
      - name: Run the packaged-extension browser tests
        env:
          PATEAT_E2E_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: mise run //tests/extension:test
      - name: Archive browser test failure context
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/extension/
          if-no-files-found: ignore
          retention-days: 7
  ci-check:
    name: CI Check
    needs: [changes, verify, orders, browser]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all verification to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ORDERS_RESULT: ${{ needs.orders.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          # The browser shards are skipped only on a documentation-only pull request.
          BROWSER_EXPECTED: ${{ needs.changes.outputs.browser == 'true' && 'success' || 'skipped' }}
        run: |
          test "${CHANGES_RESULT}" = success
          test "${VERIFY_RESULT}" = success
          test "${ORDERS_RESULT}" = success
          test "${BROWSER_RESULT}" = "${BROWSER_EXPECTED}"
  deploy:
    name: Deploy tested server
    # Every main push whose CI passed releases; there is no enable switch. Until the owner
    # has set the production credentials, the first step fails before any change.
    needs: [ci-check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-check.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: production
    # Keep this lock through migration, activation and smoke. Only one release waits for it:
    # a later arrival cancels the waiting one, so the server can lag until the next release;
    # the check below keeps it from moving back.
    concurrency:
      group: server-production
      cancel-in-progress: false
    permissions:
      contents: read # Check out the revision and compare it with the live one.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_WORKER: ${{ vars.SERVER_WORKER }}
      SERVER_HEALTH_URL: ${{ vars.SERVER_HEALTH_URL }}
    steps:
      - name: Require the production credentials before anything else
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${API_TOKEN}" || ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Set the production environment secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - *checkout
      - *mise
      - *install
      - name: Release only a revision that is ahead of the live server
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main often gains merges faster than CI finishes, so runs can reach this step out
          # of order; the server never moves back, but a cancelled waiting run can leave it
          # behind until the next release.
          live="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "${SERVER_HEALTH_URL}" | jq -r '.revision // empty' || true)"
          if [[ "${live}" =~ ^[0-9a-f]{40}$ ]]; then
            order="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${live}...${GITHUB_SHA}" --jq .status)"
          else
            # Without a readable live revision, only the main head may be released.
            head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "${head}" = "${GITHUB_SHA}" ]]; then order=ahead; else order=behind; fi
            echo "The live revision is unreadable; releasing only the main head ${head}." >> "${GITHUB_STEP_SUMMARY}"
          fi
          case "${order}" in
            ahead) echo "release=true" >> "${GITHUB_OUTPUT}" ;;
            identical | behind)
              if [[ "${order}" = identical && "${GITHUB_RUN_ATTEMPT}" -gt 1 ]]; then
                # A retry after the activation: repeat the release so that the readback and
                # the smoke checks run again (migrations and the version are idempotent).
                echo "release=true" >> "${GITHUB_OUTPUT}"
                echo "Revision ${GITHUB_SHA} is live and this is attempt ${GITHUB_RUN_ATTEMPT}; repeating the release." >> "${GITHUB_STEP_SUMMARY}"
              else
                echo "release=false" >> "${GITHUB_OUTPUT}"
                echo "Revision ${GITHUB_SHA} is not ahead of the live server (${order}); nothing to release." >> "${GITHUB_STEP_SUMMARY}"
              fi
              ;;
            *)
              echo "::error::Live revision ${live} is not on main (${order}); check the server before releasing."
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.source.outputs.release == 'true' }}
        with:
          name: server-${{ github.sha }}
          path: work/server-release/
      - name: Verify the artifact digests and deployment configuration
        if: ${{ steps.source.outputs.release == 'true' }}
        id: restore
        run: mise exec -- node .github/scripts/server-artifact.mjs restore
      # A failed migration stops the release before activation.
      - name: Apply the released migrations to the recorded database
        if: ${{ steps.source.outputs.release == 'true' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE: ${{ steps.restore.outputs.database }}
          CF_QUIET: "1"
        run: |
          cf=(mise exec -- node node_modules/cf/bin/cf)
          migrations="${GITHUB_WORKSPACE}/work/server-release/migrations"
          # Verify the target before changing it: the exact ID and its expected name.
          "${cf[@]}" d1 get "${DATABASE}" |
            jq -e --arg id "${DATABASE}" '(.result // .) | .uuid == $id and .name == "pateat"' > /dev/null
          {
            echo '```json'
            "${cf[@]}" d1 migrations list "${DATABASE}" --dir "${migrations}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          "${cf[@]}" d1 migrations apply "${DATABASE}" --dir "${migrations}"
          "${cf[@]}" d1 migrations list "${DATABASE}" --dir "${migrations}" |
            jq -e 'length == 0' > /dev/null
      # The action uploads the version, creates the 100% deployment and then reads that
      # deployment back within 30 seconds, and it never repeats an activation by itself.
      # On 2026-10-12 it failed without confirming a deployment (an upload answered 504,
      # or the readback got no timely answer for the whole budget). One more activation of
      # the same build, after a short wait, must pass the same strict readback.
      - name: Activate the exact prebuilt server
        if: ${{ steps.source.outputs.release == 'true' }}
        id: deploy
        continue-on-error: true
        uses: risu729/wrangler-deploy-action@a9db854f3a31cdf3cdf28977e66f52f32fc9e8a0 # v2.2.2
        with: &activation
          mode: production
          working-directory: services/api
          worker: ${{ vars.SERVER_WORKER }}
          build-mode: production
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          production-strategy: versions
          deploy-triggers: "false"
      - name: Wait before activating again
        if: ${{ steps.source.outputs.release == 'true' && steps.deploy.outcome == 'failure' }}
        run: sleep 30
      - name: Activate the exact prebuilt server again after a failed activation
        if: ${{ steps.source.outputs.release == 'true' && steps.deploy.outcome == 'failure' }}
        id: deploy-retry
        uses: risu729/wrangler-deploy-action@a9db854f3a31cdf3cdf28977e66f52f32fc9e8a0 # v2.2.2
        with: *activation
      - name: Verify deployment readback and hosted revision
        if: ${{ steps.source.outputs.release == 'true' }}
        env:
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ steps.deploy-retry.outputs.deployment-id || steps.deploy.outputs.deployment-id }}
          VERSION_ID: ${{ steps.deploy-retry.outputs.version-id || steps.deploy.outputs.version-id }}
        run: mise exec -- node .github/scripts/server-health.mjs
      # Synthetic owners are seeded in D1 and every row they own is removed again;
      # see services/api/README.md. A failure leaves the release failed.
      - name: Run hosted smoke checks
        if: ${{ steps.source.outputs.release == 'true' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE: ${{ steps.restore.outputs.database }}
        run: mise exec -- node services/api/smoke/hosted.ts
