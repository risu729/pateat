name: Format credential tests
on:
  push:
    branches: [codex/1355-format-validation]
    paths: [.github/workflows/ci.yml]
permissions: {}
defaults:
  run:
    shell: bash
env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  PATEAT_REVISION: ${{ github.sha }}
jobs:
  format:
    name: Pinned credential test formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Format the two credential test files
        run: |
          mise exec -- oxfmt --write apps/extension/src/login/runtime-tests/admission-20.test.ts tests/extension/login.spec.ts
      - name: Export formatter patch
        if: ${{ !cancelled() }}
        run: |
          mise exec -- node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const paths = ["apps/extension/src/login/runtime-tests/admission-20.test.ts","tests/extension/login.spec.ts"];
          const patch = execFileSync("git", ["diff", "--", ...paths], { encoding: "utf8" });
          const encoded = Buffer.from(patch, "utf8").toString("base64");
          for (let i = 0; i < encoded.length; i += 12000) console.log("FORMAT_PATCH " + i / 12000 + " " + encoded.slice(i, i + 12000));
          console.log("FORMAT_DONE");
          NODE
