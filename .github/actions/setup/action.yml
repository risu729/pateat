name: Set up mise and dependencies
description: Install the locked mise tools and the frozen workspace dependencies, optionally with the test browser.
inputs:
  cache:
    description: Restore and save mise's tool cache. Release builds pass "false".
    default: "true"
  browser:
    description: Also install Playwright's Chromium for the browser tests.
    default: "false"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.5
        install_args: --locked
        cache: ${{ inputs.cache }}
    - name: Install frozen dependencies
      shell: bash
      run: mise deps --force aube_workspace
    - name: Install isolated browser runtime
      if: ${{ inputs.browser == 'true' }}
      shell: bash
      # No --with-deps: the runner image already has every library Chromium links (a missing
      # one stops the launch with the file named). apt only added fonts, xvfb and updates, all
      # unused by headless tests: 25 MB a slow Azure mirror took 8-9.5 minutes for (2026-10-22).
      run: mise run browser:install
