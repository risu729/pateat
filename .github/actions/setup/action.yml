name: Set up mise
description: Install the locked mise tools, optionally with the test browser. The first mise run or mise exec installs the frozen workspace dependencies.
inputs:
  cache:
    description: Restore and save mise's tool cache. Release builds pass "false".
    default: "true"
  browser:
    description: Also install Playwright's Chromium for the browser tests.
    default: "false"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.11
        install_args: --locked
        cache: ${{ inputs.cache }}
    - name: Install isolated browser runtime
      if: ${{ inputs.browser == 'true' }}
      shell: bash
      # No --with-deps: the runner image already has every library Chromium links (a missing
      # one stops the launch with the file named). apt only added fonts, xvfb and updates, all
      # unused by headless tests: 25 MB a slow Azure mirror took 8-9.5 minutes for (2026-10-22).
      run: mise run browser:install
