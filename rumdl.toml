[global]
exclude = ["node_modules", "**/.wxt", "**/.output", "**/.cloudflare", "**/.vitepress/cache", "**/.vitepress/dist"]

[MD013]
line_length = 88
code_blocks = false
tables = false
reflow = true

[per-file-ignores]
# The home page's hero shows the title, so the page has no level 1 heading.
"apps/docs/src/index.md" = ["MD041"]
"apps/docs/src/ja/index.md" = ["MD013", "MD041"]
# Japanese has no spaces between words, so a line break inside a paragraph shows as a
# space; keep each Japanese paragraph on one line.
"README.ja.md" = ["MD013"]
"apps/docs/src/ja/*.md" = ["MD013"]
