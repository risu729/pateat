#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.8"
monorepo_root = true

[monorepo]
# Each project keeps its own tasks; run one as //services/api:build.
config_roots = ["apps/extension", "services/api", "packages/*", "tests/*"]

[tools]
aube = "v2.7.2"
# Writes bun.lock (ADR 0032) and runs the inference benchmark and the Formasaurus import.
bun = "1.4.3"
node = "26.12.0"
python = "3.14.8"
hk = "2.7.1"
"npm:oxlint" = "1.88.0"
"npm:typescript" = "7.0.2"
oxfmt = "0.73.0"
jactionlint = "v2.2.0"
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.31.1"
tombi = "1.8.9"
rumdl = "v0.3.0"
yamlfmt = "0.21.0"
uv = "0.13.1"
yamllint = "1.38.0"
typos = "1.51.1"
pkl = "0.32.1"
betterleaks = "1.9.0"

[settings]
experimental = true
lockfile = true
lockfile_mode = "generate"
lockfile_platforms = ["linux-x64", "windows-x64"]

[env]
_.path = ["node_modules/.bin"]

[task_config]
# Repository-wide tasks; each project keeps its own in its mise.toml.
includes = ["tasks.toml"]

# The builtin aube provider requires aube-lock.yaml; Bun owns our lockfile (ADR 0032).
[deps.aube_workspace]
auto = true
sources = [
  "package.json",
  "bun.lock",
  "aube-workspace.yaml",
  "bunfig.toml",
  "apps/*/package.json",
  "packages/*/package.json",
  "services/*/package.json",
]
outputs = ["node_modules"]
run = "aube {% if env.CI | default(value='') == 'true' %}ci{% else %}install --frozen-lockfile{% endif %}"
