#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.8"
monorepo_root = true

[monorepo]
# Each project keeps its own tasks; run one as //services/api:build.
config_roots = ["apps/extension", "services/api", "packages/*", "tests/*"]

[tools]
bun = "1.4.3"
node = "26.11.1"
python = "3.14.8"
hk = "2.5.0"
"npm:oxlint" = "1.87.0"
"npm:typescript" = "7.0.2"
oxfmt = "0.72.0"
jactionlint = "2.0.2"
shellcheck = "0.11.0"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.30.1"
tombi = "1.8.2"
rumdl = "v0.2.79"
yamlfmt = "0.21.0"
uv = "0.13.0"
yamllint = "1.38.0"
typos = "1.51.1"
pkl = "0.32.1"
betterleaks = "1.9.0"

[settings]
experimental = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[settings.npm]
package_manager = "bun"

[env]
_.path = ["node_modules/.bin"]

[task_config]
# Repository-wide tasks; each project keeps its own in its mise.toml.
includes = ["tasks.toml"]
